server.port=8099

spring.application.name=sharecrm-im-gateway
spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# qixin
qixin.api.enabled=true

# SSE 配置
# SSE 连接超时时间（毫秒），默认 5 分钟
sse.timeout=300000
# SSE 连接最大存活时间（毫秒），默认 30 分钟
sse.max-lifetime=1800000
