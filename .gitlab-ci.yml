stages:
  - build
  - package

variables:
  PLUGIN_NAME: "openclaw-sharecrm"
  NODE_VERSION: "20"

# 构建 openclaw-sharecrm 插件
build-sharecrm-plugin:
  stage: build
  image: node:${NODE_VERSION}-alpine
  working_directory: openclaw-sharecrm
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - openclaw-sharecrm/dist/
      - openclaw-sharecrm/package.json
      - openclaw-sharecrm/openclaw.plugin.json
      - openclaw-sharecrm/README.md
    expire_in: 1 hour
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - openclaw-sharecrm/node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# 打包插件
package-sharecrm-plugin:
  stage: package
  image: alpine:latest
  needs:
    - build-sharecrm-plugin
  script:
    - apk add --no-cache zip nodejs
    - mkdir -p dist-package
    - cp -r openclaw-sharecrm/dist dist-package/
    - cp openclaw-sharecrm/package.json dist-package/
    - cp openclaw-sharecrm/openclaw.plugin.json dist-package/
    - cp openclaw-sharecrm/README.md dist-package/
    - cd dist-package
    - PLUGIN_VERSION=$(node -p "require('./package.json').version")
    - zip -r ../${PLUGIN_NAME}-v${PLUGIN_VERSION}.zip .
    - cd ..
    - rm -rf dist-package
    - echo "✅ 构建完成: ${PLUGIN_NAME}-v${PLUGIN_VERSION}.zip"
  artifacts:
    name: "${PLUGIN_NAME}-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    paths:
      - ${PLUGIN_NAME}-v*.zip
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
