<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">API 文档</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f6f8fb;
            color: #1f2328;
        }
        .page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #eef2f7;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid #d0d7de;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #344054;
            transition: all 0.2s ease;
        }
        .icon-btn:hover {
            background: #f8fafc;
            border-color: #98a2b3;
            transform: translateY(-1px);
        }
        .icon-btn.copied {
            color: #067647;
            border-color: #abefc6;
            background: #ecfdf3;
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
        }
        .content {
            padding: 28px 36px 40px;
            line-height: 1.75;
            font-size: 15px;
        }
        .content h1, .content h2, .content h3, .content h4 {
            line-height: 1.3;
            margin: 1.6em 0 0.7em;
        }
        .content h1 { font-size: 32px; margin-top: 0; }
        .content h2 { font-size: 24px; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
        .content h3 { font-size: 20px; }
        .content p, .content ul, .content ol { margin: 0.85em 0; }
        .content code {
            background: #f3f4f6;
            padding: 0.15em 0.4em;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
            font-size: 0.92em;
        }
        .content pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
        }
        .content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            display: block;
            overflow-x: auto;
        }
        .content th, .content td {
            border: 1px solid #e5e7eb;
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
        }
        .content th {
            background: #f8fafc;
            font-weight: 600;
        }
        .content a { color: #175cd3; }
        @media (max-width: 768px) {
            .page { padding: 12px; }
            .content { padding: 20px 16px 28px; }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <div class="toolbar">
            <button class="icon-btn" id="copyMarkdownBtn" title="复制 Markdown" aria-label="复制 Markdown">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            <button class="icon-btn" id="copyMarkdownLinkBtn" title="复制 Markdown 链接" aria-label="复制 Markdown 链接">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
            </button>
            <a class="icon-btn" th:href="${markdownUrl}" title="查看 Markdown 原文" aria-label="查看 Markdown 原文">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 3h7v7"></path>
                    <path d="M10 14 21 3"></path>
                    <path d="M21 14v7h-7"></path>
                    <path d="M3 10 14 21"></path>
                </svg>
            </a>
        </div>
        <div class="content" th:utext="${contentHtml}"></div>
    </div>
</div>
<script th:inline="javascript">
    const markdown = /*[[${markdown}]]*/ '';
    const markdownUrl = new URL(/*[[${markdownUrl}]]*/ '', window.location.origin).toString();

    function markCopied(element) {
        const previousTitle = element.title;
        element.classList.add('copied');
        element.title = '已复制';
        setTimeout(() => {
            element.classList.remove('copied');
            element.title = previousTitle;
        }, 1500);
    }

    async function copyText(text, element) {
        await navigator.clipboard.writeText(text);
        markCopied(element);
    }

    document.getElementById('copyMarkdownBtn').addEventListener('click', async function () {
        await copyText(markdown, this);
    });

    document.getElementById('copyMarkdownLinkBtn').addEventListener('click', async function () {
        await copyText(markdownUrl, this);
    });
</script>
</body>
</html>
