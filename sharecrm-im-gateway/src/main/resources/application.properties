server.port=8099

spring.application.name=sharecrm-im-gateway
spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SSE 配置
# SSE 连接最大存活时间（毫秒），默认 30 分钟
sse.max-lifetime=1800000
# SSE 客户端建议重连等待时间（毫秒）
sse.retry-delay=1000
# 每个 appId 在内存中保留的可重放消息数
sse.replay-limit=200
